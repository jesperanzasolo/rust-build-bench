# rust-lang/rust-analyzer: 45 workspace crates, expect-test snapshot tests,
# 4 build scripts, deep salsa-based crate graph (hir-* -> ide-*).
name = "rust-analyzer"
kind = "git"
repo = "https://github.com/rust-lang/rust-analyzer"
description = "Rust language server. Deep crate graph, many fast unit tests."

commit = "dd5ed69d4b5b26fe7f91013b1d02608cd37ae199"
replay_commits = 10

# rust-analyzer's CI runs `cargo nextest run --no-fail-fast` on latest stable,
# with rust-src installed. Stable is not pinned upstream; pin it for the run.
cargo_args = []
metadata_args = []

# Tests no tool runs (METHODOLOGY.md, "Test scope"): they failed under every tool in
# run 2026-10-15 because they need tools the runner does not have (nightly rustfmt,
# a git checkout with history), or they walk the whole repository.
#   xtask            codegen and tidy checks (git, rustfmt)
#   smol_str/tidy    rustfmt check
#   test_format_document*   nightly rustfmt
#   self_hosting_parsing    parses every .rs file in the repository
skip_binaries = ["xtask", "smol_str/tidy"]
skip_tests = ["test_format_document", "self_hosting_parsing"]

[env]
RUSTUP_TOOLCHAIN = "1.99.0"

[toolchain]
components = ["rust-src"]

# test_format_document_range needs a nightly rustfmt and skips itself when
# none is installed. No toolchain other than the pinned stable is installed.

# Runtime reads that cross crate boundaries (only hermetic tools use these; found
# from the Bazel failures in run 2026-10-15). Cargo-based tools read them directly.
[extra_data]
syntax = ["crates/parser/test_data/**", "bench_data/**"]
mbe = ["bench_data/**"]
hir-ty = ["bench_data/**"]
ide-db = ["bench_data/**"]
ide = ["bench_data/**"]
ide-diagnostics = ["bench_data/**"]
rust-analyzer = ["bench_data/**", "editors/code/package.json", "docs/book/src/**"]

[canary]
upstream = "stdx"
downstream = "ide"
