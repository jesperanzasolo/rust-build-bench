# Runs the benchmark, one job (one fresh machine) per (tool, corpus) pair.
#
# Start a run by pushing a branch named bench/<anything> whose bench-run.env sets
# RUN_ID, CORPORA and TOOLS (optionally RUNNER, default ubuntu-24.04: GitHub's
# standard 4 vCPU / 16 GB runner, and REQUIRE_CPU, a CPU model substring every job
# must run on), or with "Run workflow" in the Actions tab.
# Each job publishes its results to the branch run/<RUN_ID>/<tool>--<corpus>; the
# report job merges them into run/<RUN_ID>/report.
name: bench
on:
  push:
    branches: ["bench/**"]
  workflow_dispatch:
    inputs:
      run_id: {description: "run id", required: true}
      corpora: {description: "comma-separated corpora", default: "ruff,rust-analyzer"}
      tools: {description: "comma-separated tools", default: "cargo,cargo-sccache,cargo-rail,moon,bazel,buck2"}
      bench: {description: "protocol file", default: "bench.toml"}
      runner: {description: "runs-on label", default: "ubuntu-24.04"}

permissions:
  contents: write

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      run_id: ${{ steps.p.outputs.run_id }}
      corpora: ${{ steps.p.outputs.corpora }}
      tools: ${{ steps.p.outputs.tools }}
      bench: ${{ steps.p.outputs.bench }}
      suffix: ${{ steps.p.outputs.suffix }}
      runner: ${{ steps.p.outputs.runner }}
      pairs: ${{ steps.p.outputs.pairs }}
      cpu: ${{ steps.p.outputs.cpu }}
    steps:
      - uses: actions/checkout@v5
      - id: p
        env:
          IN_RUN_ID: ${{ inputs.run_id }}
          IN_CORPORA: ${{ inputs.corpora }}
          IN_TOOLS: ${{ inputs.tools }}
          IN_BENCH: ${{ inputs.bench }}
          IN_RUNNER: ${{ inputs.runner }}
        run: |
          if [ -f bench-run.env ]; then . ./bench-run.env; fi
          RUN_ID=${IN_RUN_ID:-$RUN_ID}; CORPORA=${IN_CORPORA:-$CORPORA}
          TOOLS=${IN_TOOLS:-$TOOLS}; BENCH=${IN_BENCH:-${BENCH:-bench.toml}}
          RUNNER=${IN_RUNNER:-${RUNNER:-ubuntu-24.04}}
          echo "runner=$RUNNER" >> "$GITHUB_OUTPUT"
          echo "cpu=${REQUIRE_CPU:-}" >> "$GITHUB_OUTPUT"
          echo "pairs=$(python3 -c 'import json,sys; print(json.dumps([{"tool": t, "corpus": c} for t in sys.argv[1].split(",") for c in sys.argv[2].split(",")]))' "$TOOLS" "$CORPORA")" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "corpora=$CORPORA" >> "$GITHUB_OUTPUT"
          echo "bench=$BENCH" >> "$GITHUB_OUTPUT"
          echo "suffix=${SUFFIX:-}" >> "$GITHUB_OUTPUT"
          echo "tools=$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1].split(",")))' "$TOOLS")" >> "$GITHUB_OUTPUT"

  bench:
    needs: plan
    name: ${{ matrix.tool }} / ${{ matrix.corpus }}
    runs-on: ${{ needs.plan.outputs.runner }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.pairs) }}
    env:
      RUN_ID: ${{ needs.plan.outputs.run_id }}
      CORPORA: ${{ matrix.corpus }}
      BENCH: ${{ needs.plan.outputs.bench }}
      RBB_PUBLISH: "1"
      RBB_PUBLISH_NAME: ${{ matrix.tool }}--${{ matrix.corpus }}
      # Reruns use a SUFFIX (e.g. --v2); the report job overlays branches in name
      # order, so a rerun's files win.
      RBB_PUBLISH_BRANCH: run/${{ needs.plan.outputs.run_id }}/${{ matrix.tool }}--${{ matrix.corpus }}${{ needs.plan.outputs.suffix }}
    steps:
      - uses: actions/checkout@v5
      - name: Free disk (GitHub-hosted runners)
        if: startsWith(needs.plan.outputs.runner, 'ubuntu-')
        run: |
          # Preinstalled SDKs the benchmark never uses; Bazel and Buck2 need ~25 GB.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null || true
      - name: Machine
        env:
          REQUIRE_CPU: ${{ needs.plan.outputs.cpu }}
        run: |
          nproc; free -g; df -h / /mnt 2>/dev/null; grep -m1 'model name' /proc/cpuinfo; python3 --version
          # Optional: insist on one CPU model so every pair is timed on the same
          # hardware (GitHub mixes models). A job on another model fails here at once;
          # re-run the failed jobs until all land on the required model.
          if [ -n "$REQUIRE_CPU" ] && ! grep -m1 'model name' /proc/cpuinfo | grep -qF "$REQUIRE_CPU"; then
            echo "::error::CPU is not '$REQUIRE_CPU'; re-run this job"; exit 1
          fi
          git config --global user.name "Jonathan Esperanza"
          git config --global user.email "9872176+jesperanzasolo@users.noreply.github.com"
          # Work on whichever disk has the most free space.
          root=$(df --output=avail,target / /mnt 2>/dev/null | tail -n +2 | sort -n | tail -1 | awk '{print $2}')
          if [ "$root" != "/" ]; then sudo mkdir -p "$root/rbb" && sudo chown "$(id -u):$(id -g)" "$root/rbb"; w="$root/rbb"; else w="$HOME"; fi
          echo "RBB_WORK=$w/rbb-work" >> "$GITHUB_ENV"
          echo "work root: $w"
      - name: rustup
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Run
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "results/$RUN_ID"
          ./run.sh "$RUN_ID" "$CORPORA" "${{ matrix.tool }}" "$BENCH" 2>&1 | tee "results/$RUN_ID/job-${{ matrix.tool }}-${{ matrix.corpus }}.log"
      - name: Publish
        if: always()
        run: scripts/collect.sh "$RUN_ID" "${{ matrix.tool }}--${{ matrix.corpus }}"

  report:
    needs: [plan, bench]
    if: always()
    runs-on: ubuntu-24.04
    env:
      RUN_ID: ${{ needs.plan.outputs.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Merge per-tool results and report
        run: |
          git config --global user.name "Jonathan Esperanza"
          git config --global user.email "9872176+jesperanzasolo@users.noreply.github.com"
          for b in $(git ls-remote --heads origin "run/$RUN_ID/*" | awk '{print $2}' | sed 's#refs/heads/##' | grep -v -E '/(report|all)$' | sort); do
            git fetch -q origin "$b"
            git archive FETCH_HEAD "results/$RUN_ID" | tar -x
          done
          python3 -m rbb report "results/$RUN_ID"
          RBB_PUBLISH_BRANCH="run/$RUN_ID/report" scripts/collect.sh "$RUN_ID" all
